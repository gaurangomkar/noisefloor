# Copy this file to noisefloor.yaml and point it at your Alertmanager,
# webhook database, or an export. Relative paths are resolved from this file.
#
# Durations accept Go units plus d and w: 15m, 168h, 7d.

window: 7d
# Pin the end of the window to rerun a week. Omit it to use the current time.
# now: 2026-03-02T00:00:00Z
timezone: UTC

business_hours:
  enabled: true
  timezone: America/New_York
  days: [mon, tue, wed, thu, fri]
  start: "09:00"
  end: "17:00"

sources:
  alertmanager:
    url: http://127.0.0.1:9093
    timeout: 30s
    # password_env: ALERTMANAGER_PASSWORD
    # bearer_token_env: ALERTMANAGER_TOKEN
    include_silenced: true
    include_inhibited: true
  sqlite:
    path: noisefloor.db
  files:
    - path: alerts.ndjson
  # Optional. The block is ignored until you uncomment it.
  # The token is read from PAGERDUTY_TOKEN unless token or token_env is set.
  # pagerduty:
  #   service_ids: []
  #   timeout: 30s

rules:
  paths:
    - rules/
    - alerts.yaml

grouping:
  labels: [team]
  fallback: unowned

ignore:
  alertnames:
    - Watchdog
    - InfoInhibitor
  name_patterns:
    - '(?i)watchdog'
  matchers:
    - labels:
        severity: none

flap:
  window: 15m

scoring:
  volume_cap: 30
  actionable_after: 10m
  auto_resolve_grace: 5m
  off_hours_severities: [page, critical, high]
  count_unspecified_severity: true

weights:
  volume: 1
  flap: 2
  short_ttr: 1.5
  auto_resolve: 2
  off_hours: 1
  duplicate: 1.2

thresholds:
  max_noise_score: 60
  # How many rules may sit at or above max_noise_score before the command
  # exits 2. Zero means any noisy rule fails the run.
  max_noisy_rules: 0
  fail_on_threshold: true

recommendations:
  min_fires: 5
  tune_flap_rate: 0.30
  tune_duplicate_ratio: 0.30
  tune_off_hours_rate: 0.50
  mute_auto_resolve: 0.75
  slo_min_fires: 15

output:
  dir: out
  formats: [markdown, html, json]
  markdown: noisefloor.md
  html: noisefloor.html
  json: noisefloor.json

webhook:
  addr: ":8080"
  token_env: NOISEFLOOR_WEBHOOK_TOKEN
